# The contents of this file is based on https://github.com/home-assistant/core/blob/dev/pyproject.toml

target-version = "py314"

[lint]
select = [
    "ALL",
]

ignore = [
    "ANN401", # Dynamically typed expressions (typing.Any) are disallowed
    "D203", # no-blank-line-before-class (incompatible with formatter)
    "D212", # multi-line-summary-first-line (incompatible with formatter)
    "D213", # multi-line-summary-second-line (conflicts with D212 handling)
    "COM812", # incompatible with formatter
    "ISC001", # incompatible with formatter
    "EM101", # raw string in exception; readable enough here
    "EM102", # f-string in exception; readable enough here
    "TRY003", # long messages outside the exception class
    "N818", # exception names without an "Error" suffix (HA config-flow style)
]

[lint.per-file-ignores]
"scripts/*" = ["T201"] # scripts print to stdout on purpose

[lint.flake8-pytest-style]
fixture-parentheses = false

[lint.pyupgrade]
keep-runtime-typing = true

[lint.mccabe]
max-complexity = 25
